name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Ruff check
        run: uv run ruff check src/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Mypy
        run: uv run mypy src/xiao/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Run tests
        run: uv run pytest tests/ -v

  package:
    # Build the sdist + wheel exactly like publish.yml, then install the wheel
    # into a clean venv (no dev deps, no source tree) and run the entry point.
    # Catches missing package data (dashboard/index.html), broken metadata and
    # import errors that the in-repo test suite can't see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/xiao-venv
          /tmp/xiao-venv/bin/pip install --quiet dist/*.whl
      - name: Smoke-test the installed CLI
        env:
          XIAO_NO_CTA: "1"
          XDG_CONFIG_HOME: /tmp/xiao-config
        run: |
          cd /tmp
          /tmp/xiao-venv/bin/xiao --version
          /tmp/xiao-venv/bin/xiao --help > /dev/null
          /tmp/xiao-venv/bin/python -c "import importlib.resources as r; assert (r.files('xiao.dashboard') / 'index.html').is_file()"
          /tmp/xiao-venv/bin/python -c "from xiao.dashboard.server import create_app; create_app()"
          # Not configured → must exit 2 (documented exit-code contract).
          set +e; /tmp/xiao-venv/bin/xiao status --json; code=$?; set -e
          test "$code" -eq 2
      - name: Version matches pyproject
        run: |
          expected=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          actual=$(/tmp/xiao-venv/bin/xiao --version | awk '{print $2}')
          test "$expected" = "$actual"
